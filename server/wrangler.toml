# The whole of Awalé's back end: the game itself, and the rooms people play in.
#
# One Worker serves both. That is not a saving of a few pounds — it is what
# makes the two agree. Same origin means the browser can find the match server
# without being told where it is, there is no CORS to configure, and a deploy
# cannot leave a new site pointing at an old server.
#
# Durable Objects are what make the rooms work: exactly one instance per room
# name, worldwide, handling one message at a time. A plain Worker cannot hold a
# game.
name = "awale"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The built web app. `run_worker_first` puts the router in front of everything,
# so `/room/:code` and `/queue` reach the Worker and are never mistaken for a
# missing page; the router hands everything else back to ASSETS.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Rooms are small and short-lived, so they use SQLite-backed storage, which is
# the class available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# Sign-in, at tag v2 because that is what the live Worker actually applied: a
# hand-run `wrangler deploy` of this branch created the Identity class there
# before the branch was merged.
#
# Two rules follow from that, and both have already cost a broken deploy.
#
# Every tag the published script has ever been at must appear in this file,
# even one that did nothing. Wrangler compares the script's tag against this
# list, and a tag it cannot find reads as "this script has had no migrations at
# all" — so it replays from v1, tries to create a Room class that already holds
# rooms, and Cloudflare refuses (error 10074).
#
# And this entry must stay v2 rather than being renumbered to sit after some
# later tag. The live script is already at v2 with Identity created; moving the
# class to a v3 would make wrangler try to create it a second time, which fails
# the same way. Add the next tag, never edit this one.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Identity"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Leaderboard"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "IDENTITY"
class_name = "Identity"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[vars]
# Origins allowed to call /queue from a *different* site. The game itself is
# served from this Worker, so same-origin requests need nothing here; this is
# only for a separately hosted copy of the front end.
ALLOWED_ORIGINS = ""

# Where a player lands after answering on WhatsApp, and the origin phone-verif
# is told to call back. Leave empty to use the origin the request came from,
# which is right when the game is served by this Worker; set it when the front
# end is hosted somewhere else.
PUBLIC_APP_URL = "https://awale-web.vercel.app"

# PHONE_VERIF_API_KEY is a secret, not a var:
#
#   cd server && npx wrangler secret put PHONE_VERIF_API_KEY
#
# Without it the /auth routes answer 503 and the game runs exactly as it did
# before, anonymously. AUTH_SESSION_SECRET is an optional second secret; when
# it is absent, session tokens are signed with a key derived from the API key.

[observability]
enabled = true
