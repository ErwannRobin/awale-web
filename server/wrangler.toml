# The match server. Deploy with `npx wrangler deploy` from this directory.
#
# Durable Objects are what make this work: exactly one instance per room name,
# worldwide, handling one message at a time. A plain Worker cannot hold a game.
name = "awale-match"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Rooms are cheap and short-lived, so they use SQLite-backed storage, which is
# the class available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[vars]
# Lock /queue to the site's own origin(s) before going public, e.g.
# ALLOWED_ORIGINS = "https://awale.example,https://www.awale.example"
# Unset means any origin may ask for a match.
ALLOWED_ORIGINS = ""

[observability]
enabled = true
